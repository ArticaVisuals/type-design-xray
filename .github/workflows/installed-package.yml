name: Installed package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-smoke:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel with compound support
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob('dist/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call(
          [sys.executable, '-m', 'pip', 'install', '--force-reinstall',
          wheels[0] + '[compound]'])"

      - name: Run cross-platform test suite
        run: |
          python -m pip install "pytest>=7"
          python -m pytest -q

      - name: Check installed package
        run: |
          python -m pip check
          python -I -c "from importlib.metadata import version; import typedesignxray; from typedesignxray.config import available_presets; assert typedesignxray.__version__ == version('type-design-xray') == '1.0.0'; assert available_presets() == ['blueprint', 'contrast', 'drafting', 'light']"

      - name: Smoke-test installed commands
        run: |
          type-design-xray --version
          tdxray --version
          type-design-xray-preview --help
          tdxray-preview --help
          type-design-xray examples/BlueprintDemo.glyphs "AV" --compound --quiet --out "${{ runner.temp }}/type-design-xray-smoke.svg"
          python -c "import xml.etree.ElementTree as ET; root = ET.parse(r'${{ runner.temp }}/type-design-xray-smoke.svg').getroot(); assert root.tag.endswith('svg')"

      - name: Verify documented macOS setup
        if: runner.os == 'macOS' && matrix.python-version == '3.14'
        shell: bash
        run: |
          python3 -m venv .documented-venv
          .documented-venv/bin/python -m pip install --upgrade pip
          .documented-venv/bin/python -m pip install ".[compound]"
          .documented-venv/bin/type-design-xray examples/Roboto-Regular-subset.ufo "Type" --quiet --out "$RUNNER_TEMP/documented-setup.svg"
          test -s "$RUNNER_TEMP/documented-setup.svg"

      - name: Verify documented Windows PowerShell setup
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          py -3 -m venv .documented-venv
          & .\.documented-venv\Scripts\python.exe -m pip install --upgrade pip
          & .\.documented-venv\Scripts\python.exe -m pip install ".[compound]"
          $output = Join-Path $env:RUNNER_TEMP "documented-setup.svg"
          & .\.documented-venv\Scripts\type-design-xray.exe examples\Roboto-Regular-subset.ufo "Type" --quiet --out $output
          if (-not (Test-Path $output -PathType Leaf)) {
            throw "Documented Windows setup did not create its SVG"
          }
