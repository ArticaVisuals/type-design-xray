name: Installed package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-smoke:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel with compound support
        run: >-
          python -c "import glob, subprocess, sys;
          wheels = glob.glob('dist/*.whl');
          assert len(wheels) == 1, wheels;
          subprocess.check_call(
          [sys.executable, '-m', 'pip', 'install', '--force-reinstall',
          wheels[0] + '[compound]'])"

      - name: Run cross-platform test suite
        run: |
          python -m pip install "pytest>=7"
          python -m pytest -q

      - name: Check installed package
        run: |
          python -m pip check
          python -I -c "from importlib.metadata import version; import typedesignxray; from typedesignxray.config import available_presets; assert typedesignxray.__version__ == version('type-design-xray') == '1.1.0'; assert available_presets() == ['blueprint', 'contrast', 'drafting', 'light']"
          python -I -c "from pathlib import Path; from typedesignxray.specimen import catalog_request, render_request, specimen_page; source = Path('examples/BlueprintDemo.glyphs').resolve(); catalog = catalog_request({'font_path': str(source)}); assert catalog['sequence'][0]['label'] == 'A / a'; rendered = render_request({'font_path': str(source), 'glyphs': ['A', 'a'], 'mode': 'xray'}); assert rendered['compounded'] and len(rendered['renders']) == 2 and 'Specimen Player' in specimen_page()"
          python -I -c "from pathlib import Path; from typedesignxray.process import catalog_request, render_request; from typedesignxray.process_page import process_page; source = Path('examples/BlueprintDemo.glyphs').resolve(); catalog = catalog_request({'font_path': str(source), 'glyph': 'a'}); assert catalog['layers'][0]['name'] == 'Skeleton v1' and catalog['layers'][-1]['is_final'] and catalog['final_hold_ms'] == 1000; rendered = render_request({'font_path': str(source), 'glyph': 'a', 'layer_id': catalog['layers'][0]['layer_id'], 'bezier': False, 'handles': False}); assert 'data-mode=\"outline\"' in rendered['svg'] and 'Font Design Process Video' in process_page()"
          python -I -c "from typedesignxray.tool_nav import tool_switcher; assert tool_switcher('xray').count('tool-tab') == 3 and 'every designed symbol' in tool_switcher('specimen')"

      - name: Smoke-test installed commands
        run: |
          type-design-xray --version
          tdxray --version
          type-design-xray-preview --help
          tdxray-preview --help
          type-design-xray examples/BlueprintDemo.glyphs "AV" --compound --quiet --out "${{ runner.temp }}/type-design-xray-smoke.svg"
          python -c "import xml.etree.ElementTree as ET; root = ET.parse(r'${{ runner.temp }}/type-design-xray-smoke.svg').getroot(); assert root.tag.endswith('svg')"

      - name: Verify documented macOS setup
        if: runner.os == 'macOS' && matrix.python-version == '3.14'
        shell: bash
        run: |
          python3 -m venv .documented-venv
          .documented-venv/bin/python -m pip install --upgrade pip
          .documented-venv/bin/python -m pip install ".[compound]"
          .documented-venv/bin/type-design-xray examples/Roboto-Regular-subset.ufo "Type" --quiet --out "$RUNNER_TEMP/documented-setup.svg"
          test -s "$RUNNER_TEMP/documented-setup.svg"

      - name: Install macOS specimen media dependencies
        if: runner.os == 'macOS' && matrix.python-version == '3.9'
        shell: bash
        run: |
          brew list cairo >/dev/null 2>&1 || brew install cairo
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python -m pip install "cairosvg>=2.7"

      - name: Smoke-test specimen PNG, GIF, and MP4 export
        if: runner.os == 'macOS' && matrix.python-version == '3.9'
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from typedesignxray.process import catalog_request as process_catalog
          from typedesignxray.process import export_request as process_export
          from typedesignxray.specimen_export import export_frame, export_specimen

          source = Path("examples/BlueprintDemo.glyphs").resolve()
          output = Path(os.environ["RUNNER_TEMP"])
          png = output / "specimen-frame.png"
          gif = output / "specimen.gif"
          mp4 = output / "specimen.mp4"
          process_png = output / "process-layer.png"
          process_gif = output / "process.gif"
          process_mp4 = output / "process.mp4"
          export_frame(source, png, frame_number=1, format_name="png", xray=True)
          export_specimen(source, gif, format_name="gif", start_frame=1, end_frame=1, xray=True)
          export_specimen(source, mp4, format_name="mp4", start_frame=1, end_frame=1, xray=True)
          process = process_catalog({"font_path": str(source), "glyph": "a"})
          process_common = {
              "font_path": str(source),
              "glyph": "a",
              "bezier": True,
              "handles": True,
          }
          process_export(dict(process_common, format="png", output_path=str(process_png), layer_id=process["layers"][0]["layer_id"]))
          process_export(dict(process_common, format="gif", output_path=str(process_gif), speed=0.2))
          process_export(dict(process_common, format="mp4", output_path=str(process_mp4), speed=0.2))
          assert png.read_bytes().startswith(b"\x89PNG")
          assert gif.read_bytes().startswith(b"GIF89a")
          assert mp4.stat().st_size > 100
          assert process_png.read_bytes().startswith(b"\x89PNG")
          assert process_gif.read_bytes().startswith(b"GIF89a")
          assert process_mp4.stat().st_size > 100
          PY

      - name: Verify documented Windows PowerShell setup
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          py -3 -m venv .documented-venv
          & .\.documented-venv\Scripts\python.exe -m pip install --upgrade pip
          & .\.documented-venv\Scripts\python.exe -m pip install ".[compound]"
          $output = Join-Path $env:RUNNER_TEMP "documented-setup.svg"
          & .\.documented-venv\Scripts\type-design-xray.exe examples\Roboto-Regular-subset.ufo "Type" --quiet --out $output
          if (-not (Test-Path $output -PathType Leaf)) {
            throw "Documented Windows setup did not create its SVG"
          }
