[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "type-design-xray"
version = "1.2.1"
description = "X-ray any letterform: outline, nodes and bezier handles, exported straight from your font source files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Micah Hoang" }]
keywords = ["font", "typography", "glyphs", "bezier", "svg", "type-design", "after-effects"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Fonts",
]
dependencies = [
    "fonttools>=4.40",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
raster = ["cairosvg>=2.7"]
compound = ["skia-pathops>=0.8"]
dev = ["pytest>=7.0"]

[project.scripts]
type-design-xray = "typedesignxray.cli:main"
tdxray = "typedesignxray.cli:main"
type-design-xray-preview = "typedesignxray.web:main"
tdxray-preview = "typedesignxray.web:main"

[project.urls]
Homepage = "https://github.com/ArticaVisuals/type-design-xray"
Issues = "https://github.com/ArticaVisuals/type-design-xray/issues"

[tool.setuptools.packages.find]
include = ["typedesignxray*"]

[tool.setuptools.package-data]
typedesignxray = ["presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
